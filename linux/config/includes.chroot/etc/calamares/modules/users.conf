# Compte de l'ordinateur. Brume ouvre ensuite sa propre session (avec ses comptes).
---
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - bluetooth
    - lpadmin
    - users
sudoersGroup:   sudo
sudoersConfigureWithGroup: false
autologinGroup: autologin
doAutologin:    true
setRootPassword: false
doReusePassword: true
passwordRequirements:
    minLength: 8
    maxLength: -1
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
    shell: /bin/bash
    forbidden_names: [ root ]
    home_permissions: "o700"
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "brume-${first}"
    forbidden_names: [ localhost ]
presets:
    fullName:
        editable: true
    loginName:
        editable: true
