# /etc/default/grub existe déjà (paquet GRUB installé juste avant) : seuls le nom
# du système et les options du noyau sont modifiés. Voir aussi /etc/default/grub.d/brume.cfg.
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
# splash : écran de démarrage de Brume (Plymouth) ; voir linux/build.sh
kernel_params: [ "quiet", "splash", "loglevel=3", "plymouth.use-simpledrm" ]
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "0"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "console"
    GRUB_DISABLE_RECOVERY: false
always_use_defaults: false
