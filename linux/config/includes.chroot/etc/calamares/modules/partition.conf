# Choix proposés : installer à côté (Windows est réduit), effacer le disque,
# remplacer une partition (ou utiliser l'espace libre), partitionnement manuel.
---
efi:
    mountPoint:      "/boot/efi"
    recommendedSize: 512MiB
    minimumSize:     32MiB
    label:           "EFI"
userSwapChoices:
    - none
    - file
initialSwapChoice: file
luksGeneration: luks1
# « Chiffrer le système » (Effacer le disque, Remplacer une partition, Installer à côté) : tout est chiffré sauf
# /boot (le noyau). Le mot de passe est alors demandé par l'écran de démarrage de Brume (Plymouth), avec la
# disposition du clavier choisie dans l'installateur, et non par GRUB, qui ne connaît que le clavier QWERTY.
enableLuksAutomatedPartitioning: true
preCheckEncryption: false
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: none
defaultFileSystemType: "ext4"
essentialMounts: [ "live-*", "control", "ventoy" ]
lvm:
    enable: false

# Partitions créées par l'installateur : /boot (1 Gio, jamais chiffré), puis le système sur le reste.
# (La partition EFI est ajoutée d'elle-même sur les PC récents.)
partitionLayout:
    - name: "boot"
      filesystem: "ext4"
      noEncrypt: true
      mountPoint: "/boot"
      size: 1G
    - name: "brume"
      filesystem: "unknown"
      mountPoint: "/"
      size: 100%
