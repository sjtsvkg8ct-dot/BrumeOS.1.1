---
# Disque chiffré : la clé enregistrée par luksbootkeyfile ouvre le disque au démarrage, après le mot de passe
# demandé par GRUB (sinon il serait demandé deux fois). Sans « keyscript=/bin/cat », initramfs-tools l'ignorerait.
crypttabOptions: luks,keyscript=/bin/cat
tmpOptions:
    default:
        tmpfs: false
        options: ""
    ssd:
        tmpfs: false
        options: ""
