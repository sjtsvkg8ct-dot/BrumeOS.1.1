# Installateur de Brume OS (Calamares).
# Copie Brume sur le disque de l'ordinateur, à côté de Windows ou à sa place.
# Lancé depuis Brume : Réglages › Installation (seulement sur la clé USB).
---
modules-search: [ local ]

instances:
- id:     brume-grub
  module: shellprocess
  config: shellprocess-brume-grub.conf
- id:     brume-fin
  module: shellprocess
  config: shellprocess-brume-fin.conf
  weight: 10

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - networkcfg
  - hwclock
  - shellprocess@brume-grub
  - grubcfg
  - bootloader
  - shellprocess@brume-fin
  - initramfscfg
  - initramfs
  - umount
- show:
  - finished

branding: brume
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
